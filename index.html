<h2>Feature: New Dashboard UI</h2>

<label>
  <input type="checkbox" id="toggleFeature" />
  Enable New Feature
</label>

<div id="oldUI">
  <p>Old Dashboard View</p>
</div>

<div id="newUI" style="display:none;">
  <p style="color:green;">✨ New Dashboard View Enabled!</p>
</div>

<script>
  const toggle = document.getElementById("toggleFeature");
  const oldUI = document.getElementById("oldUI");
  const newUI = document.getElementById("newUI");

  toggle.addEventListener("change", () => {
    if (toggle.checked) {
      oldUI.style.display = "none";
      newUI.style.display = "block";
    } else {
      oldUI.style.display = "block";
      newUI.style.display = "none";
    }
  });
</script>
